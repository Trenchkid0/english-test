# ==============================================================================
# Nginx Reverse Proxy Configuration with Compression & Caching for Ruang Kata
# ==============================================================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name english.yourdomain.com;
    return 301 https://$host$request_uri;
}

# HTTPS Main Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name english.yourdomain.com;

    # SSL Certificates (managed e.g. via certbot)
    ssl_certificate /etc/letsencrypt/live/english.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/english.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --------------------------------------------------------------------------
    # Gzip Compression Configuration (HTML, CSS, JS, JSON, SVG, XML)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Static Assets with Cache-Busting Query Strings (?v=...)
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|svg|woff2?|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache control for versioned assets
        if ($query_string ~* "v=") {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        if ($query_string !~* "v=") {
            add_header Cache-Control "public, max-age=86400";
        }
    }

    # --------------------------------------------------------------------------
    # Main Proxy Pass for App & API Endpoints
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for longer requests (e.g. AI generation / streaming)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
